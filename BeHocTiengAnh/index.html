/* Layout: one screen at a time. Home -> 10 learning worlds -> activities. Giant touch targets, picture first, word second. */
:root {
  --sky: #CDEBFF;
  --sky-deep: #9AD3FF;
  --ink: #1F2A55;
  --sun: #FFC93C;
  --grass: #3CC47C;
  --berry: #FF5E7E;
  --grape: #8A6CFF;
  --wave: #2FA8FF;
  --card: #FFFFFF;
  --soft: #5B6690;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--sky);
  background-image: radial-gradient(circle at 15% 8%, #ffffff88 0 60px, transparent 61px),
                    radial-gradient(circle at 85% 18%, #ffffff66 0 40px, transparent 41px);
  color: var(--ink);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none; -webkit-user-select: none;
  overflow-x: hidden; overscroll-behavior: none;
}
.app {
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(14px, env(safe-area-inset-top, 0px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 16px;
  box-sizing: border-box;
}
button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; background: none; padding: 0; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
h2 { font-family: var(--display); font-weight: 800; margin: 0; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bar .grow { flex: 1; }
.round {
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--card); box-shadow: 0 5px 0 var(--sky-deep);
  font-size: 30px; display: grid; place-items: center; flex: none;
}
.round:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sky-deep); }
.round.small { width: 48px; height: 48px; font-size: 24px; }
.round.holding { animation: fillhold 2s linear forwards; }
@keyframes fillhold { from { box-shadow: inset 0 0 0 0 var(--grape), 0 5px 0 var(--sky-deep); } to { box-shadow: inset 0 0 0 30px var(--grape), 0 5px 0 var(--sky-deep); } }
.stars {
  font-family: var(--display); font-weight: 800; font-size: 24px;
  background: var(--card); border-radius: 999px; padding: 6px 16px;
  box-shadow: 0 5px 0 var(--sky-deep); white-space: nowrap;
}

/* ---------- home ---------- */
.hello h1 {
  font-family: var(--display); font-weight: 800; margin: 0;
  font-size: clamp(36px, 10vw, 54px); line-height: 1; text-wrap: balance;
}
.hello h1 span { color: var(--berry); }
.hello p { margin: 6px 0 0; color: var(--soft); font-size: 16px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile {
  border-radius: 28px; padding: 14px 8px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  box-shadow: 0 7px 0 rgba(31,42,85,.22); color: #fff; text-align: center;
}
.tile:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(31,42,85,.22); }
.tile .pic { font-size: 58px; line-height: 1.1; }
.tile .en { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.1; }
.tile .vi { font-size: 14px; opacity: .95; }
.tile .got { font-size: 13px; font-weight: 800; background: #ffffff33; border-radius: 99px; padding: 1px 10px; margin-top: 4px; }
.tile.wide { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 14px; padding: 16px 12px; text-align: left; }
.tile.wide .pic { font-size: 52px; }
.tile.wide .en { font-size: 32px; }
.parent { font-size: 13px; color: var(--soft); text-align: center; line-height: 1.5; max-width: 44ch; margin: 4px auto 0; }
.pick { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; }
.pick button {
  width: 48px; height: 48px; border-radius: 50%; background: var(--card); font-size: 27px;
  box-shadow: 0 4px 0 var(--sky-deep); display: grid; place-items: center; opacity: .75;
}
.pick button.on { opacity: 1; outline: 4px solid var(--berry); outline-offset: 2px; }
.pick-label { text-align: center; font-size: 14px; color: var(--soft); margin: 0 0 -8px; }
.worldhead { display: flex; align-items: center; gap: 14px; border-radius: 28px; padding: 14px 18px; color: #fff; }
.worldhead .pic { font-size: 60px; line-height: 1; }
.worldhead h2 { font-size: 34px; line-height: 1; }
.worldhead p { margin: 4px 0 0; font-size: 15px; opacity: .95; }

/* ---------- learn cards ---------- */
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.card {
  width: min(100%, 380px); aspect-ratio: 1 / 1; max-width: 100%;
  background: var(--card); border-radius: 40px; box-shadow: 0 10px 0 var(--sky-deep);
  display: grid; place-items: center; position: relative; overflow: hidden;
}
.card .big { font-size: clamp(130px, 44vw, 200px); line-height: 1; }
.card .count { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 4px; padding: 28px; font-size: clamp(34px, 10vw, 46px); line-height: 1.05; }
.card .numeral { position: absolute; top: 10px; left: 20px; font-family: var(--display); font-weight: 800; font-size: 56px; color: var(--grape); }
.card .shape { width: 72%; }
.card .letter { display: flex; align-items: baseline; gap: 4px; font-family: var(--display); font-weight: 800; line-height: .9; color: var(--berry); font-size: clamp(110px, 34vw, 160px); }
.card .letter small { font-size: .62em; color: var(--wave); }
.card .letter-pic { position: absolute; bottom: 16px; left: 20px; font-size: 64px; }
.blob { width: 68%; aspect-ratio: 1; border-radius: 46% 54% 50% 50% / 52% 46% 54% 48%; border: 6px solid #0002; }
.card .ear { position: absolute; right: 14px; bottom: 14px; font-size: 28px; background: var(--sun); width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; }
.word .en { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 12vw, 62px); line-height: 1; }
.word .vi { color: var(--soft); font-size: 18px; margin-top: 4px; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: min(100%, 380px); }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 180px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: .7; }
.dots i.on { background: var(--ink); opacity: 1; }
.arrow { width: 80px; height: 80px; border-radius: 50%; font-size: 38px; color: #fff; background: var(--wave); box-shadow: 0 6px 0 #1b7fc4; display: grid; place-items: center; flex: none; }
.arrow:active { transform: translateY(5px); box-shadow: 0 1px 0 #1b7fc4; }
.arrow.green { background: var(--grass); box-shadow: 0 6px 0 #24935a; }

/* ---------- quiz ---------- */
.ask .q { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 9vw, 42px); line-height: 1.05; }
.ask .q b { color: var(--berry); }
.ask .vi { color: var(--soft); font-size: 16px; }
.choices { display: grid; gap: 14px; width: 100%; }
.choices.two { grid-template-columns: 1fr 1fr; }
.choice {
  background: var(--card); border-radius: 32px; box-shadow: 0 8px 0 var(--sky-deep);
  min-height: 140px; display: grid; place-items: center; font-size: 92px; line-height: 1; padding: 10px;
}
.choice:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--sky-deep); }
.choice .blob { width: 104px; }
.choice .shape { width: 110px; }
.choice.right { background: #D8FFE6; box-shadow: 0 8px 0 var(--grass); }
.choice .label { display: block; font-family: var(--display); font-weight: 800; font-size: 22px; margin-top: 4px; }
.choice .sub { display: block; font-size: 14px; color: var(--soft); }
.numsm, .lettersm { font-family: var(--display); font-weight: 800; color: var(--grape); }
.lettersm { color: var(--berry); }
.groupe { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; font-size: 40px; max-width: 150px; }

/* ---------- talking buddy ---------- */
.buddy { width: 96px; flex: none; }
.buddy.lg { width: 120px; }
.buddy svg { display: block; width: 100%; height: auto; overflow: visible; }
.buddy .mouth { transform-box: fill-box; transform-origin: center; transform: scaleY(.3); }
.buddy .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
.buddy.talking .mouth { animation: talk .18s infinite alternate ease-in-out; }
.buddy.talking svg { animation: bob .36s infinite alternate ease-in-out; }
.buddy.emo { display: grid; place-items: center; aspect-ratio: 1; font-size: 72px; line-height: 1; }
.buddy.emo.lg { font-size: 92px; }
.buddy.emo span { display: block; }
.buddy.emo.talking span { animation: chat .3s infinite alternate ease-in-out; }
@keyframes talk { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes bob { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-5px) rotate(2deg); } }
@keyframes chat { from { transform: translateY(0) scale(1) rotate(-4deg); } to { transform: translateY(-8px) scale(1.08) rotate(4deg); } }
.talkrow { display: flex; align-items: center; gap: 10px; width: 100%; }
.talkrow > :last-child { min-width: 0; flex: 1; }
.bubble {
  background: var(--card); border-radius: 26px; padding: 10px 18px; position: relative;
  font-family: var(--display); font-weight: 800; font-size: clamp(22px, 6.5vw, 30px); line-height: 1.1;
  box-shadow: 0 5px 0 var(--sky-deep);
}
.bubble b { color: var(--berry); }
.bubble::before { content: ""; position: absolute; left: -12px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right-color: var(--card); border-left: 0; }
.bubble small { display: block; font-family: var(--body); font-weight: 600; font-size: 15px; color: var(--soft); margin-top: 2px; }
.progress { height: 10px; background: #ffffff88; border-radius: 99px; overflow: hidden; width: 100%; }
.progress i { display: block; height: 100%; background: var(--grape); border-radius: 99px; transition: width .4s; }

/* ---------- counting ---------- */
.counting { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; background: var(--card); border-radius: 32px; padding: 20px 12px; box-shadow: 0 8px 0 var(--sky-deep); }
.cnt { font-size: 58px; line-height: 1; position: relative; width: 78px; height: 78px; display: grid; place-items: center; border-radius: 22px; }
.cnt.done { background: #FFF4CC; }
.cnt.done::after {
  content: attr(data-n); position: absolute; top: -8px; right: -6px; width: 34px; height: 34px; border-radius: 50%;
  background: var(--grape); color: #fff; font-family: var(--display); font-weight: 800; font-size: 22px; display: grid; place-items: center;
}

/* ---------- patterns ---------- */
.pat { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; background: var(--card); border-radius: 28px; padding: 16px 10px; box-shadow: 0 8px 0 var(--sky-deep); }
.pat span { font-size: 46px; width: 58px; height: 58px; display: grid; place-items: center; line-height: 1; }
.pat .hole { border: 4px dashed var(--grape); border-radius: 16px; font-family: var(--display); font-weight: 800; color: var(--grape); font-size: 36px; }

/* ---------- sequence ---------- */
.slots { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 8px; width: 100%; }
.slot { aspect-ratio: 1; border: 4px dashed #ffffffcc; border-radius: 18px; display: grid; place-items: center; font-size: 40px; position: relative; background: #ffffff55; }
.slot b { position: absolute; top: 2px; left: 8px; font-family: var(--display); font-size: 16px; color: var(--soft); }
.slot.filled { border-style: solid; border-color: var(--grass); background: var(--card); }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.step { background: var(--card); border-radius: 26px; box-shadow: 0 7px 0 var(--sky-deep); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.step .p { font-size: 64px; line-height: 1.05; }
.step .t { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.1; text-align: center; }
.step .v { font-size: 13px; color: var(--soft); text-align: center; }

/* ---------- memory ---------- */
.mem { display: grid; gap: 10px; width: 100%; }
.mcard { aspect-ratio: 3 / 4; border-radius: 20px; background: var(--grape); box-shadow: 0 6px 0 #6a50d6; display: grid; place-items: center; font-size: 44px; color: #fff; transition: transform .25s; }
.mcard.open, .mcard.ok { background: var(--card); box-shadow: 0 6px 0 var(--sky-deep); transform: rotateY(180deg); }
.mcard.open span, .mcard.ok span { transform: rotateY(180deg); }
.mcard.ok { background: #D8FFE6; box-shadow: 0 6px 0 var(--grass); }

/* ---------- drawing & tracing ---------- */
.pad { width: 100%; background: #fff; border-radius: 28px; box-shadow: 0 8px 0 var(--sky-deep); touch-action: none; display: block; }
.pad.square { aspect-ratio: 1; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.sw { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 3px 0 var(--sky-deep); }
.sw.on { outline: 4px solid var(--ink); outline-offset: 1px; }
.tool { min-width: 48px; height: 48px; border-radius: 16px; background: var(--card); box-shadow: 0 4px 0 var(--sky-deep); font-size: 24px; display: grid; place-items: center; padding: 0 8px; }
.tool.on { background: var(--sun); }

/* ---------- piano ---------- */
.keys { display: flex; gap: 6px; width: 100%; height: min(52vh, 340px); }
.key { flex: 1; border-radius: 0 0 18px 18px; background: var(--kc); box-shadow: 0 8px 0 rgba(31,42,85,.25); position: relative; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; }
.key i { width: 18px; height: 18px; border-radius: 50%; background: #ffffffcc; }
.key.down { transform: translateY(6px); box-shadow: 0 2px 0 rgba(31,42,85,.25); filter: brightness(1.15); }
.key .star { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 30px; opacity: 0; }
.key.hint .star { opacity: 1; animation: hop .5s infinite alternate ease-in-out; }
@keyframes hop { to { transform: translate(-50%, -8px); } }

/* ---------- move / freeze ---------- */
.action { width: min(100%, 380px); background: var(--card); border-radius: 40px; box-shadow: 0 10px 0 var(--sky-deep); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; box-sizing: border-box; }
.action .big { font-size: clamp(110px, 36vw, 170px); line-height: 1.05; }
.action .big.dance { animation: dance .5s infinite alternate ease-in-out; }
@keyframes dance { from { transform: rotate(-10deg) translateY(0); } to { transform: rotate(10deg) translateY(-10px); } }
.timer { height: 14px; width: 100%; background: #E6EEFF; border-radius: 99px; overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--grass); border-radius: 99px; }

/* ---------- stickers & parents ---------- */
.stickers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.stk { aspect-ratio: 1; background: var(--card); border-radius: 18px; display: grid; place-items: center; font-size: 38px; box-shadow: 0 4px 0 var(--sky-deep); }
.stk.lock { background: #ffffff77; box-shadow: none; font-size: 24px; color: var(--soft); }

let RUN = 0;

function stopAll() {
  RUN++;
  timeouts.forEach(clearTimeout); timeouts.clear();
  intervals.forEach(clearInterval); intervals.clear();

/* ---------- voice ---------- */
let voice = null;

  if (!('speechSynthesis' in window)) return;

function setTalking(on) { document.querySelectorAll('.buddy').forEach(b => b.classList.toggle('talking', on)); }
function say(text, onDone) {
  clearTimeout(talkTimer);
  const r = RUN;
  let finished = false;
  const finish = () => { if (finished) return; finished = true; clearTimeout(talkTimer); setTalking(false); if (onDone && r === RUN) onDone(); };
  setTalking(true);

  const a = audio(); if (!a) return;
  freqs.forEach((f, i) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f;
    const t = a.currentTime + i * dur;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.6);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur * 1.7);
  });
}

  });
  g.connect(a.destination);
}

function award(n) {
  S.stars += n;
  if (curWorld) S.world[curWorld.id] = (S.world[curWorld.id] || 0) + n;
  const sn = $('#starn'); if (sn) sn.textContent = S.stars;
  const have = Math.floor(S.stars / 3);
  if (have > S.stk) {
    S.stk = have;
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = `🎁 New sticker! ${STICKERS[(have - 1) % STICKERS.length]}`;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
  }
  save();
}
function celebrate(text) {
  const p = document.createElement('div');
  p.className = 'party'; p.innerHTML = `<div class="msg">${text}</div>`;
  document.body.appendChild(p);
  const bits = ['⭐','🎉','🎈','💖','🌟'];
  for (let k = 0; k < 18; k++) {
    const c = document.createElement('div');
    c.className = 'confetti'; c.textContent = bits[k % bits.length];
    c.style.left = Math.random() * 92 + 'vw'; c.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 2300);
  }
  setTimeout(() => p.remove(), 1700);
}
function holdable(el, ms, cb) {
  let t = null;
  const end = () => { clearTimeout(t); el.classList.remove('holding'); };
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('holding'); t = setTimeout(() => { end(); cb(); }, ms); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, end));
  el.addEventListener('contextmenu', e => e.preventDefault());
}

/* =====================================================================
   ABC: letter tracing
   ===================================================================== */
function makePad(canvas, onPoint) {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let last = null;
  const pos = e => { const b = canvas.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  canvas.onpointerdown = e => { e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (x) {} last = pos(e); onPoint(last, last, true); };
  canvas.onpointermove = e => { if (!last) return; const p = pos(e); onPoint(p, last, false); last = p; };
  canvas.onpointerup = canvas.onpointercancel = () => { last = null; };
  return { ctx, w: r.width, h: r.height };
}
function trace(i, back) {
  const [Lt, w, vi, p] = LETTERS[i];
  show(`${bar(back, '<button class="round" id="again" aria-label="Nghe lại">🔊</button>')}
    <div class="talkrow">${buddy()}<div class="bubble">Trace the letter <b>${Lt}</b>!<small>Bé dùng ngón tay tô theo chữ ${Lt} (${p} ${w})</small></div></div>
    <canvas id="cv" class="pad square" aria-label="Bảng tô chữ ${Lt}"></canvas>
    <div class="nav" style="width:100%">
      <button class="arrow" id="prev" aria-label="Chữ trước">◀</button>
      <button class="tool" id="clear" aria-label="Tô lại">🔄</button>
      <button class="arrow green" id="next" aria-label="Chữ tiếp">▶</button>
    </div>`, back);
  const sayIt = () => say(`Trace the letter ${Lt}. ${Lt} is for ${w}.`);
  $('#again').onclick = sayIt;
  $('#prev').onclick = () => { click(); trace((i + 25) % 26, back); };
  $('#next').onclick = () => { click(); trace((i + 1) % 26, back); };
  sayIt();
  const r = RUN;
  const ready = document.fonts && document.fonts.load ? document.fonts.load('800 100px "Baloo 2"') : Promise.resolve();
  ready.catch(() => {}).then(() => { if (r === RUN) setup(); });
  function setup() {
    const cv = $('#cv');
    const G = 60, mask = new Set(), covered = new Set();
    const m = document.createElement('canvas'); m.width = m.height = G;
    const mc = m.getContext('2d');
    const font = s => `800 ${s}px "Baloo 2", "Arial Rounded MT Bold", sans-serif`;
    mc.font = font(G * 0.85); mc.textAlign = 'center'; mc.textBaseline = 'middle'; mc.fillText(Lt, G / 2, G * 0.56);
    const data = mc.getImageData(0, 0, G, G).data;
    for (let k = 0; k < G * G; k++) if (data[k * 4 + 3] > 120) mask.add(k);
    let hue = rnd(360), done = false;
    const pad = makePad(cv, (pt, prev) => {
      const ctx = pad.ctx;
      hue = (hue + 4) % 360;
      ctx.strokeStyle = `hsl(${hue} 85% 55%)`; ctx.lineWidth = pad.w * 0.075;
      ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(pt[0] + 0.01, pt[1]); ctx.stroke();
      const cx = Math.floor(pt[0] / pad.w * G), cy = Math.floor(pt[1] / pad.h * G);
      for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 2; dy++) {
        const x = cx + dx, y = cy + dy; if (x < 0 || y < 0 || x >= G || y >= G) continue;
        const idx = y * G + x; if (mask.has(idx)) covered.add(idx);
      }
      if (!done && covered.size / mask.size > 0.6) {
        done = true; award(1); ding(); celebrate(pick(PRAISE)); say(`Great job! ${Lt}! ${Lt} is for ${w}!`);
      }
    });
    const guide = () => {
      const ctx = pad.ctx; ctx.clearRect(0, 0, pad.w, pad.h);
      ctx.font = font(pad.w * 0.85); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#E4ECFF'; ctx.fillText(Lt, pad.w / 2, pad.h * 0.56);
      ctx.save(); ctx.setLineDash([10, 12]); ctx.lineWidth = 3; ctx.strokeStyle = '#9DB2F5'; ctx.strokeText(Lt, pad.w / 2, pad.h * 0.56); ctx.restore();
    };
    guide();
    $('#clear').onclick = () => { click(); covered.clear(); done = false; guide(); };
  }
}

  show(`${bar(back, song ? '<button class="round" id="listen" aria-label="Nghe mẫu">👂</button>' : '')}
    <div class="talkrow">${buddy()}<div class="bubble">${song ? song.en : 'Play the piano!'}<small>${song ? 'Bé bấm phím có ngôi sao ⭐. Bấm 👂 để nghe mẫu.' : 'Bé bấm các phím màu để chơi nhạc'}</small></div></div>
    ${song ? '<div class="progress"><i id="pg" style="width:0"></i></div>' : ''}
    <div class="keys">${NOTES.map((f, k) => `<button class="key" data-k="${k}" style="--kc:${KEYC[k]}" aria-label="Phím ${k + 1}"><span class="star">⭐</span><i></i></button>`).join('')}</div>`, back);
  const keys = [...app.querySelectorAll('.key')];
  let pos = 0, auto = false;
  const hint = () => { keys.forEach(k => k.classList.remove('hint')); if (song && pos < song.n.length) keys[song.n[pos]].classList.add('hint'); };
  const press = k => { note(NOTES[k]); keys[k].classList.add('down'); setTimeout(() => keys[k].classList.remove('down'), 160); };
  keys.forEach(el => el.addEventListener('pointerdown', e => {
    e.preventDefault(); if (auto) return;
    const k = +el.dataset.k; press(k);
    if (song && k === song.n[pos]) {
      pos++; $('#pg').style.width = (pos / song.n.length * 100) + '%';
      if (pos === song.n.length) {
        keys.forEach(x => x.classList.remove('hint'));
        award(2); celebrate('Bravo!');
        later(() => say(`Bravo! You played ${song.en}!`, () => later(() => { pos = 0; $('#pg').style.width = '0'; hint(); }, 1500)), 600);
        return;
      }
    }
    hint();
  }));
  if (song) {
    $('#listen').onclick = () => {
      if (auto) return; auto = true; keys.forEach(x => x.classList.remove('hint'));
      song.n.forEach((k, j) => later(() => press(k), j * 420));
      later(() => { auto = false; hint(); }, song.n.length * 420 + 300);
    };
    say(`Let's play ${song.en}! Press the star.`);
  } else say('Play the piano!');
  hint();
}

const PENTA = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25];
function freeze(back) {
  show(`${bar(back)}
    <div class="stage">
      <div class="action"><div class="big" id="fp">💃</div><div class="word"><div class="en" id="fw">Freeze dance!</div><div class="vi" id="fv">Nhạc chạy thì nhảy, nhạc dừng thì ĐỨNG YÊN!</div></div></div>
      <button class="go" id="fgo">▶ Start</button>
    </div>`, back);
  let rounds = 0;
  $('#fgo').onclick = () => { $('#fgo').remove(); say("When the music stops, freeze!", () => dance()); };
  function dance() {
    $('#fp').textContent = pick(['💃', '🕺', '🐻', '🦄', '🐸']); $('#fp').classList.add('dance');
    $('#fw').textContent = 'Dance!'; $('#fv').textContent = 'Nhảy múa theo nhạc nào!';
    setTalking(true);
    let step = 0;
    const id = every(() => { note(PENTA[(step++ * 3 + rnd(3)) % PENTA.length], 0.3); }, 260);
    later(() => {
      clearInterval(id); setTalking(false);
      $('#fp').classList.remove('dance'); $('#fp').textContent = '🧊'; $('#fw').textContent = 'FREEZE!'; $('#fv').textContent = 'Đứng yên như tượng!';
      say('Freeze!'); rounds++; if (rounds % 2 === 0) award(1);
      later(() => say('Dance!', () => dance()), 3200);
    }, 4000 + rnd(4000));
  }
}

/* =====================================================================
   MOVE: action cards
   ===================================================================== */
function move(back) {
  let done = 0, last = null;
  next();
  function next() {
    let a = pick(ACTIONS); if (a === last) a = pick(ACTIONS); last = a;
    show(`${bar(back, '<button class="round" id="skip" aria-label="Động tác khác">⏭️</button>')}
      <div class="stage">
        <div class="action pop"><div class="big dance">${a[0]}</div><div class="word"><div class="en">${a[1]}</div><div class="vi">${a[2]}</div></div>
          <div class="timer"><i id="tm"></i></div></div>
        <div class="talkrow" style="justify-content:center">${buddy()}<div class="bubble">Do it with me!<small>Bé làm theo nhé! Ba mẹ làm cùng bé càng vui.</small></div></div>
      </div>`, back);
    $('#skip').onclick = () => { click(); next(); };
    say(a[3] || `${a[1]} ${a[1]}`, () => {
      const tm = $('#tm'); tm.style.transition = 'width 7s linear'; requestAnimationFrame(() => { tm.style.width = '0%'; });
      later(() => { done++; if (done % 3 === 0) award(1); ding(); say(pick(PRAISE), () => later(next, 500)); }, 7000);
    });
  }
}

/* =====================================================================
   BRAIN GAMES: memory match
   ===================================================================== */
let memLvl = 0;
function memory(back) {
  const pairs = [3, 4, 6][Math.min(memLvl, 2)];
  const d = DECKS[pick(['animals', 'cute', 'fruits', 'vehicles', 'fairy', 'food'])];
  const items = shuffle(d.items.slice()).slice(0, pairs);
  const cards = shuffle([...items, ...items]);
  const cols = pairs === 3 ? 3 : 4;
  show(`${bar(back)}
    <div class="talkrow">${buddy()}<div class="bubble">Find the <b>pairs</b>!<small>Lật 2 thẻ giống nhau</small></div></div>
    <div class="mem" style="grid-template-columns:repeat(${cols},1fr)">${cards.map((c, j) => `<button class="mcard" data-j="${j}" aria-label="Thẻ ${j + 1}"><span>❓</span></button>`).join('')}</div>`, back);
  say('Find the pairs!');
  let open = [], matched = 0, lock = false;
  app.querySelectorAll('.mcard').forEach(btn => btn.onclick = () => {
    if (lock || btn.classList.contains('open') || btn.classList.contains('ok')) return;
    const c = cards[+btn.dataset.j];
    btn.classList.add('open'); btn.firstChild.textContent = c.p; say(c.w); tone([600], 0.05);
    open.push(btn);
    if (open.length === 2) {
      const [a, b] = open; open = [];
      if (cards[+a.dataset.j] === cards[+b.dataset.j]) {
        a.classList.add('ok'); b.classList.add('ok'); ding(); matched++;
        if (matched === pairs) {
          award(2); memLvl++; celebrate(pick(PRAISE));
          later(() => say('You found all the pairs!', () => later(() => memory(back), 1200)), 900);
        }
      } else {
        lock = true;
        later(() => { [a, b].forEach(x => { x.classList.remove('open'); x.firstChild.textContent = '❓'; }); lock = false; }, 1000);
      }
    }
  });
}

/* =====================================================================
   WATCH: the buddy presents every deck like a video
   ===================================================================== */
const WATCH_DECKS = ['animals', 'letters', 'fruits', 'numbers', 'colors', 'shapes', 'cute', 'feelings', 'sounds', 'weather', 'food', 'clothes', 'family', 'vehicles', 'body', 'nature', 'opposites', 'fairy', 'home', 'manners'];
function watch(di = 0, i = 0) {
  if (di >= WATCH_DECKS.length) di = 0;
  const dk = WATCH_DECKS[di], d = DECKS[dk], item = d.items[i], w = item.w;
  const total = WATCH_DECKS.reduce((s, k) => s + DECKS[k].items.length, 0);
  const done = WATCH_DECKS.slice(0, di).reduce((s, k) => s + DECKS[k].items.length, 0) + i;
  const intro = item.intro || (item.pl ? `These are ${w}.` : `This is ${article(w)} ${w}.`);
  const sayWord = item.name || w;
  show(`${bar(home, '<button class="round" id="pause" aria-label="Tạm dừng">⏸️</button>')}
    <div class="stage">
      <div class="progress"><i style="width:${(done / total * 100).toFixed(1)}%"></i></div>
      <div class="card pop">${picture(item, true)}</div>
      <div class="talkrow">${buddy()}<div class="bubble" id="bubble">${intro}<small>${item.vi}</small></div></div>
    </div>`, home);
  let paused = false;
  const next = () => { if (paused) return; let ni = i + 1, nd = di; if (ni >= d.items.length) { ni = 0; nd = di + 1; } watch(nd, ni); };
  const play = () => {
    if (paused) return;
    say(intro, () => later(() => {
      if (paused) return;
      $('#bubble').innerHTML = `Say: ${sayWord}!<small>Bé đọc theo nào: ${sayWord}</small>`;
      say(`${sayWord}! Say: ${sayWord}!`, () => later(next, 1600));
    }, 350));
  };
  $('#pause').onclick = e => {
    paused = !paused; e.currentTarget.textContent = paused ? '▶️' : '⏸️';
    if (paused) { if ('speechSynthesis' in window) speechSynthesis.cancel(); clearTimeout(talkTimer); setTalking(false); } else play();
  };
  later(play, 300);
}

/* =====================================================================
   STICKER BOOK
   ===================================================================== */
function stickers() {
  const have = Math.min(S.stk, STICKERS.length);
  show(`${bar(home)}
    <div class="talkrow">${buddy()}<div class="bubble">My stickers: <b>${have}</b><small>Cứ 3 ngôi sao ⭐ bé được 1 sticker mới</small></div></div>
    <div class="stickers">${STICKERS.map((s, j) => j < have ? `<div class="stk pop">${s}</div>` : '<div class="stk lock">?</div>').join('')}</div>`, home);
  say(have ? `You have ${have} stickers! Great job!` : 'Play games to get stickers!');
}

/* =====================================================================
   PARENTS' CORNER (hold the gear for 2 seconds)
   ===================================================================== */
function today() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function parents() {
  const mins = S.usage.d === today() ? Math.round(S.usage.s / 60) : 0;
  show(`${bar(home)}
    <div class="panel"><h2>Góc ba mẹ</h2>
      <div>Hôm nay bé đã chơi <b>${mins} phút</b> · Tổng ⭐ <b>${S.stars}</b> · Sticker <b>${Math.min(S.stk, STICKERS.length)}</b></div></div>
    <div class="panel"><h2>Giới hạn giờ chơi mỗi ngày</h2>
      <div class="seg" id="lim">${[[0, 'Không giới hạn'], [15, '15 phút'], [20, '20 phút'], [30, '30 phút'], [45, '45 phút']].map(([v, t]) => `<button data-v="${v}" class="${S.limit === v ? 'on' : ''}">${t}</button>`).join('')}</div>
      <div style="color:var(--soft)">Hết giờ, app hiện màn hình "Nghỉ ngơi". Ba mẹ giữ nút 3 giây để cho bé chơi thêm 10 phút. WHO khuyên trẻ 3–4 tuổi dùng màn hình không quá 1 giờ mỗi ngày.</div></div>
    <div class="panel"><h2>Tốc độ đọc</h2>
      <div class="seg" id="rate">${[['slow', 'Chậm (cho bé mới học)'], ['normal', 'Vừa']].map(([v, t]) => `<button data-v="${v}" class="${S.rate === v ? 'on' : ''}">${t}</button>`).join('')}</div></div>
    <div class="panel"><h2>Chương trình học (theo khung EYFS, Anh)</h2>
      ${WORLDS.map(w => `<div class="row"><span>${w.pic} ${w.vi} <small style="color:var(--soft)">· ${w.area}</small></span><span>⭐ ${S.world[w.id] || 0}</span></div>`).join('')}
      <ul style="color:var(--soft)">
        <li>Ngồi cùng bé, đọc to theo giọng đọc. Bé học nhanh nhất khi được ba mẹ nói chuyện cùng.</li>
        <li>Ngoài app: chỉ đồ vật thật trong nhà và hỏi bé "What is this?".</li>
        <li>Chơi ít mà đều: mỗi ngày 10–15 phút tốt hơn 1 lần thật lâu.</li>
      </ul></div>
    <div class="panel"><h2>Xóa tiến độ</h2><button class="danger" id="reset">Xóa sao và sticker</button></div>`, home);
  app.querySelectorAll('#lim button').forEach(b => b.onclick = () => { S.limit = +b.dataset.v; save(); parents(); });
  app.querySelectorAll('#rate button').forEach(b => b.onclick = () => { S.rate = b.dataset.v; save(); parents(); say('Hello! This is my reading speed.'); });
  let armed = false;
  $('#reset').onclick = () => {
    if (!armed) { armed = true; $('#reset').textContent = 'Bấm lần nữa để xóa thật'; return; }
    S.stars = 0; S.world = {}; S.stk = 0; save(); parents();
  };
}

/* ---------- daily play-time limit ---------- */
let resting = false;
setInterval(() => {
  if (document.visibilityState !== 'visible' || resting) return;
  if (S.usage.d !== today()) S.usage = { d: today(), s: 0 };
  S.usage.s += 15; save();
  if (S.limit && S.usage.s >= S.limit * 60) rest();
}, 15000);
function rest() {
  resting = true; stopAll();
  const el = document.createElement('div');
  el.className = 'rest';
  el.innerHTML = `<div style="font-size:120px;line-height:1">😴</div><h1>Time for a break!</h1>
    <p>Hết giờ chơi hôm nay rồi. Bé đi chơi với ba mẹ nhé!</p>
    <button class="round" id="more" aria-label="Ba mẹ giữ 3 giây để chơi thêm" style="width:auto;padding:0 18px;border-radius:999px;font-size:16px;font-weight:800;color:var(--ink)">Ba mẹ giữ 3 giây: thêm 10 phút</button>`;
  document.body.appendChild(el);
  say('Time for a break! See you later!');
  holdable($('#more'), 3000, () => { S.usage.s = Math.max(0, S.usage.s - 600); save(); el.remove(); resting = false; home(); });
}

/* ---------- install guide ---------- */
const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const SHARE_ICON = '<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#2F6BFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></span>';
const PLUS_ICON = '<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#1F2A55" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>';
function installCard() {
  if (isStandalone || S.installOk) return '';
  const steps = isIOS
    ? `<li>Bấm nút <b>Chia sẻ</b> ${SHARE_ICON} ở thanh dưới của Safari.</li>
       <li>Kéo xuống, chọn <b>Thêm vào MH chính</b> ${PLUS_ICON}</li>
       <li>Bấm <b>Thêm</b> ở góc trên. Biểu tượng gấu ABC sẽ hiện ra ngoài màn hình.</li>`
    : `<li>Bấm dấu <b>⋮</b> ở góc trên của Chrome.</li>
       <li>Chọn <b>Thêm vào màn hình chính</b> hoặc <b>Cài đặt ứng dụng</b>.</li>
       <li>Bấm <b>Thêm</b>. Xong!</li>`;
  return `<div class="install"><h2>Cài app lên điện thoại</h2><ol>${steps}</ol><button id="install-ok">Đã hiểu</button></div>`;
}

/* ---------- tap to start (unlocks sound on iPhone) ---------- */
function splash() {
  const el = document.createElement('div');
  el.className = 'splash';
  el.innerHTML = `${buddy('lg')}<h1>Bé Học <span>Tiếng Anh</span></h1>
    <button class="go" id="go">▶ Bắt đầu</button>
    <p>Bật loa lên nhé. Trên iPhone, gạt nút im lặng bên hông để có tiếng.</p>`;
  document.body.appendChild(el);
  $('#go').onclick = () => { audio(); pickVoice(); say(curBuddy().hi); tone([523, 659, 784], 0.09); el.remove(); };
}

home();
splash();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
